        // --- MAIN LOGIC ---
        window.onload = function() {
            // 1. Calculate the current day and week of pregnancy
            const today = new Date();
            const startDateUTC = new Date(pregnancyStartDate.getFullYear(), pregnancyStartDate.getMonth(), pregnancyStartDate.getDate());
            const todayUTC = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            
            const differenceInTime = todayUTC.getTime() - startDateUTC.getTime();
            const differenceInDays = Math.floor(differenceInTime / (1000 * 3600 * 24)) + 1;
            const currentWeek = Math.floor((differenceInDays - 1) / 7) + 1;
            
            document.getElementById('day-counter').textContent = `Day ${differenceInDays}`;
            document.getElementById('week-counter').textContent = `Week ${currentWeek} mana journey lo!`;

            // 2. Get messages for the current week
            const messagesForThisWeek = weeklyMessages[currentWeek] || [`Amma, nenu roju roju ki peruguthunna! Nee kosam ready avuthunna!`];
            
            // 3. Logic for picking a fresh message for the current week
            const SEEN_MESSAGES_KEY = `monikaBabyMessages_v10_week${currentWeek}`;
            let shownIndices = JSON.parse(localStorage.getItem(SEEN_MESSAGES_KEY) || '[]');

            // If all messages for this week have been shown, reset the list for this week
            if (shownIndices.length >= messagesForThisWeek.length) {
                shownIndices = [];
                localStorage.setItem(SEEN_MESSAGES_KEY, JSON.stringify(shownIndices));
            }

            // Filter out messages that have already been shown
            let availableMessages = messagesForThisWeek.filter((msg, index) => !shownIndices.includes(index));

            // Select a random message from the available ones
            const randomIndex = Math.floor(Math.random() * availableMessages.length);
            const chosenMessage = availableMessages[randomIndex];
            
            // Find the original index of the chosen message to store it
            const originalIndex = messagesForThisWeek.indexOf(chosenMessage);
            
            // Update the list of shown messages and save to localStorage
            if (originalIndex > -1) {
                shownIndices.push(originalIndex);
                localStorage.setItem(SEEN_MESSAGES_KEY, JSON.stringify(shownIndices));
            }

            // 4. Display the message
            const messageElement = document.getElementById('baby-message');
            messageElement.style.opacity = 0;
            messageElement.style.transition = 'opacity 0.5s ease-in-out';
            
            setTimeout(() => {
                messageElement.textContent = chosenMessage || "Amma, neetho matladadaniki sabdalu vetukuntunna... malli try chey!";
                messageElement.style.opacity = 1;
            }, 200);
        };
    </script>
